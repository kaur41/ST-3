name: cpplint
on: [push, pull_request]
jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
    - run: pip install cpplint
    - run: cpplint --filter=-build/include_subdir,-whitespace/comments,-whitespace/indent,-legal/copyright,-readability/utf8 --recursive . --exclude=out --exclude=build
